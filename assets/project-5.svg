<svg xmlns="http://www.w3.org/2000/svg" width="420" height="176" viewBox="0 0 420 176" role="img" aria-label="MusicBucket repository card">
<title>MusicBucket repository card</title>
<defs></defs>
<style>
  .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
  .m{font-family:'JetBrains Mono','Fira Code',ui-monospace,'SFMono-Regular',Consolas,monospace}
  /* Visible by default: a renderer that ignores CSS animation still shows every card. */
  g.fx{animation:in .6s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="420" height="176" rx="14" fill="#13141f"/>
<rect x=".5" y=".5" width="419" height="175" rx="13.5" fill="none" stroke="#2f3449"/>
<defs><linearGradient id="accent4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3178c6"/><stop offset="100%" stop-color="#3178c6" stop-opacity="0"/></linearGradient></defs>
    <rect x="0" y="0" width="420" height="3" fill="url(#accent4)"/><g class="fx" style="animation-delay:60ms"><text x="24" y="42" class="m" font-size="15" fill="#7aa2f7" font-weight="700" text-anchor="start">MusicBucket</text></g><g class="fx" style="animation-delay:90ms"><text x="396" y="42" class="m" font-size="12" fill="#e0af68" font-weight="400" text-anchor="end">★ 3</text></g><g class="fx" style="animation-delay:140ms"><text x="24" y="68" class="t" font-size="12" fill="#9aa5ce" font-weight="400" text-anchor="start">Geographic music discovery. Incremental Supabase sync beat</text></g><g class="fx" style="animation-delay:190ms"><text x="24" y="85" class="t" font-size="12" fill="#9aa5ce" font-weight="400" text-anchor="start">third-party rate limits for a 25-user closed beta.</text></g><g class="fx" style="animation-delay:260ms"><rect x="24" y="120" width="56" height="20" rx="10" fill="#1f2335" stroke="#2f3449"/>
      <text x="52" y="134" class="t" font-size="10.5" fill="#9aa5ce" font-weight="400" text-anchor="middle">chartjs</text></g><g class="fx" style="animation-delay:260ms"><rect x="86" y="120" width="116" height="20" rx="10" fill="#1f2335" stroke="#2f3449"/>
      <text x="144" y="134" class="t" font-size="10.5" fill="#9aa5ce" font-weight="400" text-anchor="middle">data-visualization</text></g><g class="fx" style="animation-delay:260ms"><rect x="208" y="120" width="56" height="20" rx="10" fill="#1f2335" stroke="#2f3449"/>
      <text x="236" y="134" class="t" font-size="10.5" fill="#9aa5ce" font-weight="400" text-anchor="middle">express</text></g><g class="fx" style="animation-delay:300ms"><circle cx="30" cy="155" r="5" fill="#3178c6"/>
    <text x="42" y="159" class="t" font-size="11.5" fill="#565f89" font-weight="400" text-anchor="start">TypeScript</text></g>
</svg>