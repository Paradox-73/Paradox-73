      <text x="832" y="220" class="m" font-size="12.5" fill="#9aa5ce" font-weight="400" text-anchor="end">3.0%</text></g><g class="fx" style="animation-delay:510ms"><circle cx="36" cy="245" r="5" fill="#00B4AB"/>
      <text x="52" y="250" class="m" font-size="13" fill="#c0caf5" font-weight="400" text-anchor="start">Dart</text>
      <rect x="190" y="238" width="580" height="14" rx="7" fill="#1f2335"/>
      <rect x="190" y="238" width="34" height="14" rx="7" fill="#00B4AB"
        style="animation:grow .9s cubic-bezier(.2,.7,.3,1) both;animation-delay:710ms;transform-origin:190px 0"/>
      <text x="832" y="250" class="m" font-size="12.5" fill="#9aa5ce" font-weight="400" text-anchor="end">2.2%</text></g>
</svg>