      <rect x="190" y="88" width="580" height="14" rx="7" fill="#3572A5"
        style="animation:grow .9s cubic-bezier(.2,.7,.3,1) both;animation-delay:260ms;transform-origin:190px 0"/>
      <text x="832" y="100" class="m" font-size="12.5" fill="#9aa5ce" font-weight="400" text-anchor="end">38.0%</text></g><g class="fx" style="animation-delay:230ms"><circle cx="36" cy="125" r="5" fill="#00ADD8"/>
      <text x="52" y="130" class="m" font-size="13" fill="#c0caf5" font-weight="400" text-anchor="start">Go</text>
