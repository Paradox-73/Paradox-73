        style="animation:grow .9s cubic-bezier(.2,.7,.3,1) both;animation-delay:530ms;transform-origin:190px 0"/>
      <text x="832" y="190" class="m" font-size="12.5" fill="#9aa5ce" font-weight="400" text-anchor="end">4.8%</text></g><g class="fx" style="animation-delay:440ms"><circle cx="36" cy="215" r="5" fill="#f1e05a"/>
      <text x="52" y="220" class="m" font-size="13" fill="#c0caf5" font-weight="400" text-anchor="start">JavaScript</text>
      <rect x="190" y="208" width="580" height="14" rx="7" fill="#1f2335"/>
