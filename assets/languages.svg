<svg xmlns="http://www.w3.org/2000/svg" width="860" height="288" viewBox="0 0 860 288" role="img" aria-label="Language breakdown">
<title>Language breakdown</title>
<defs></defs>
<style>
  .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
  .m{font-family:'JetBrains Mono','Fira Code',ui-monospace,'SFMono-Regular',Consolas,monospace}
  /* Visible by default: a renderer that ignores CSS animation still shows every card. */
  g.fx{animation:in .6s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="860" height="288" rx="14" fill="#13141f"/>
<rect x=".5" y=".5" width="859" height="287" rx="13.5" fill="none" stroke="#2f3449"/>
<rect x="16" y="14" width="828" height="26" rx="6" fill="#1f2335"/>
    <circle cx="36" cy="27" r="5" fill="#f7768e"/><circle cx="54" cy="27" r="5" fill="#e0af68"/><circle cx="72" cy="27" r="5" fill="#9ece6a"/>
    <text x="430" y="32" class="m" font-size="11.5" fill="#565f89" font-weight="400" text-anchor="middle">languages.sh</text><g class="fx" style="animation-delay:80ms"><text x="28" y="64" class="m" font-size="12.5" fill="#9ece6a" font-weight="400" text-anchor="start">$</text><text x="44" y="64" class="m" font-size="12.5" fill="#c0caf5" font-weight="400" text-anchor="start">cat languages.txt  # weighted by bytes across public repos</text></g><g class="fx" style="animation-delay:160ms"><circle cx="36" cy="95" r="5" fill="#3572A5"/>
      <text x="52" y="100" class="m" font-size="13" fill="#c0caf5" font-weight="400" text-anchor="start">Python</text>
